<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Workstation — gümüş Mac mini, koyu grafit zemin (çizim)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/><stop offset="1" stop-color="#16171a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#5a8dee" stop-opacity="0.22"/><stop offset="1" stop-color="#5a8dee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/><stop offset="1" stop-color="#c9ccd2"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bdc4"/><stop offset="1" stop-color="#8d9199"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="168" fill="#ffffff" font-size="72" font-weight="700">Workstation</text>
    <text x="98" y="218" fill="#c4c8d0" font-size="26">Mac mini için tek tıkla Masaüstü · Uyku · Remote</text>
    <text x="98" y="256" fill="#8e939c" font-size="20">Fan kontrolü · disk temizleyici · otomatik güncelleme</text>
    <g transform="translate(98 292)" font-size="15" font-weight="600">
      <rect width="112" height="32" rx="16" fill="#3a3d43"/><circle cx="20" cy="16" r="5" fill="#d0d3d8"/><text x="34" y="21" fill="#e6e8eb">Masaüstü</text>
      <rect x="124" width="86" height="32" rx="16" fill="#3a3d43"/><circle cx="144" cy="16" r="5" fill="#4f8ff7"/><text x="158" y="21" fill="#e6e8eb">Uyku</text>
      <rect x="222" width="104" height="32" rx="16" fill="#3a3d43"/><circle cx="242" cy="16" r="5" fill="#34c759"/><text x="256" y="21" fill="#e6e8eb">Remote</text>
    </g>
  </g>
  <!-- Mac mini (3/4 görünüm) -->
  <g transform="translate(720 120)" filter="url(#shadow)">
    <!-- üst yüz -->
    <path d="M70 20 Q78 6 96 6 L380 6 Q398 6 404 20 L452 118 Q458 132 440 132 L36 132 Q18 132 24 118 Z" fill="url(#top)"/>
    <path d="M70 20 Q78 6 96 6 L380 6 Q398 6 404 20" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <ellipse cx="238" cy="70" rx="44" ry="16" fill="#d9dce1" opacity="0.6"/>
    <!-- ön yüz -->
    <path d="M24 132 L452 132 Q462 132 462 144 L462 176 Q462 192 444 192 L32 192 Q14 192 14 176 L14 144 Q14 132 24 132 Z" fill="url(#side)"/>
    <rect x="14" y="132" width="448" height="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="46" cy="164" r="3.5" fill="#7ce38b"/>
    <rect x="300" y="158" width="18" height="10" rx="3" fill="#5d6168"/><rect x="326" y="158" width="18" height="10" rx="3" fill="#5d6168"/>
    <circle cx="384" cy="163" r="5" fill="#5d6168"/>
    <rect x="60" y="192" width="356" height="6" rx="3" fill="#55585e" opacity="0.7"/>
  </g>
  <text x="1260" y="388" text-anchor="end" fill="#6b7078" font-size="12" font-family="Arial, sans-serif">Çizim — gerçek ürün fotoğrafı değildir</text>
</svg>
