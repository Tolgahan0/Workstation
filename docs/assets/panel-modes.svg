  <defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2c30"/><stop offset="1" stop-color="#1d1e21"/></linearGradient></defs>
  <rect width="420" height="560" rx="18" fill="url(#p)" stroke="#3b3e44"/>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
